[build]
  command = "npm run build"
  publish = "dist"

# Sign-in / dashboard → SaaS app subdomain
[[redirects]]
  from = "/signin"
  to = "https://app.tryeasyreply.com/v2"
  status = 302

[[redirects]]
  from = "/signin/*"
  to = "https://app.tryeasyreply.com/v2/:splat"
  status = 302

[[redirects]]
  from = "/dashboard"
  to = "https://app.tryeasyreply.com/dashboard"
  status = 302

[[redirects]]
  from = "/dashboard/*"
  to = "https://app.tryeasyreply.com/dashboard/:splat"
  status = 302

[[redirects]]
  from = "/settings"
  to = "https://app.tryeasyreply.com/settings"
  status = 302

[[redirects]]
  from = "/settings/*"
  to = "https://app.tryeasyreply.com/settings/:splat"
  status = 302

# Retired pages (Paddle review, Oct 2026)
[[redirects]]
  from = "/features/comment-to-dm-conversion"
  to = "/features/instagram"
  status = 301

[[redirects]]
  from = "/features/advanced-contact-campaign-management"
  to = "/features/integrations"
  status = 301

[[redirects]]
  from = "/alternatives/manychat"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/alternatives/gohighlevel"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/use-cases/social-media-brands-influencers"
  to = "/use-cases"
  status = 301
  force = true

[[redirects]]
  from = "/whatsappDM.png"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/whatsapp-automation"
  to = "/whatsapp-auto-reply"
  status = 301

[[redirects]]
  from = "/chat-automation"
  to = "/ai-chat-replies"
  status = 301

[[redirects]]
  from = "/reply-automation"
  to = "/auto-reply"
  status = 301

[[redirects]]
  from = "/ai-sales-agent"
  to = "/ai-assistant"
  status = 301

[[redirects]]
  from = "/features/high-ticket-sales-capability"
  to = "/features/buying-questions"
  status = 301

# SPA fallback — marketing site (static files like sitemap.xml are served first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
